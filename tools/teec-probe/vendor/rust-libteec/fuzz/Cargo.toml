[package]
name = "rust-libteec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
uuid = "1.19"
postcard = { version = "1.1", features = ["alloc"] }
bytemuck = "1.23"
# 仅用于给协商类 target 提供可复现的确定性随机源（`StdRng::seed_from_u64`），
# 与 xtee-psk 使用的 rand 版本一致，保证是同一个 crate 实例。
rand = { version = "0.10", default-features = false, features = ["std_rng"] }

# 直接依赖真实产品 crate（使 Wfuzz 平台按产品包归属统计被测代码）
# `fuzz` feature 只在此处启用：它额外暴露 src/teec/fuzz_api.rs 的转发层
# （薄包装到 pub(crate)/pub(super) 的真实实现，不复制产品逻辑），
# 产品构建（Makefile / debian/build.sh 的 cargo build --release --lib）不带该
# feature，C ABI 与导出符号集因此完全不变。默认 feature 保持开启，
# 使 fuzz 构建与产品默认配置（debug_level_2 + ca-sign-verify）一致。
[dependencies.rust-libteec]
path = ".."
features = ["fuzz"]

[dependencies.teec-protocol]
path = "../teec-protocol"

[dependencies.xtee-psk]
path = "../xtee-psk"

# 独立的 workspace：避免被主仓库（rust-libteec workspace）吸收，
# 导致主目录 cargo build/test 连带编译 fuzz 目录。
[workspace]
members = ["."]

[[bin]]
name = "fuzz_tee_request"
path = "fuzz_targets/fuzz_tee_request.rs"
test = false
doc = false
bench = false

