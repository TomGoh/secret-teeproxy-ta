[package]
name = "xtee-utee"
version = "0.2.3"
authors = ["huangsiyuan <huangsiyuan@kylinos.cn>"]
license = "Apache-2.0"
edition = "2024"
description = "TEE internal API bindings for xTEE Trusted Applications."
repository = "https://gitee.com/openkylin/xtee-rust-sdk.git"

[dependencies]
libc = "0.2"
anyhow = "1.0.100"
crossbeam-channel = "0.5.15"
log = "0.4"
num_enum = "0.7"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.18"
teec-protocol.workspace = true

# 库 crate 名为 rust_utee，依赖键须为 rust-libutee（与 hello-world 等一致）
rust-libutee = { version = "0.2.2", default-features = false, features = ["xtee-panic-notify"] }