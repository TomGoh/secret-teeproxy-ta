[package]
name = "rust-libutee"
version = "0.2.2"
edition = "2024"
description = "Rust library for UTEE-related functionality."
license = "Apache-2.0"
authors = ["yubo <yubo1@kylinos.cn>", "duyuqi <duyuqi@kylinos.cn>"]

[features]
default = ["ta_props_empty_impl"]
# Link `xtee_ta_panic_notify` from xtee-utee (x-kernel TA runtime). Off by default so
# `cargo publish` and standalone `src/bin/*` targets link without xtee-utee.
xtee-panic-notify = []
ta_props_empty_impl = []
strict_annotation_checks = []
trace-error = []
trace-flow = []
trace-info = []
trace-debug = []

[dependencies]
libc = "0.2"
rand = { version = "0.9.1" }
hex = { version = "0.4" }
mbedtls = { version = "0.13", package = "mbedtls-smx", default-features = false, features = [
    "std",
] }
mbedtls-sys-auto = { version = "2.28", package = "mbedtls-sys-auto-smx", default-features = false }
mbedtls-platform-support-smx = { version = "0.1", package = "mbedtls-platform-support-smx", default-features = false }

rand_chacha = { version = "0.3", default-features = false}

[lib]
crate-type = ["staticlib", "rlib"]
name = "rust_utee"
